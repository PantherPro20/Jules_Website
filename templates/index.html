<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Time</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 90vh; 
            margin: 0;
            text-align: center; 
            background-color: #add8e6; /* Added/Updated this line */
        }
        .content-wrapper {
            /* Basic wrapper if needed, can be empty if body handles all */
            position: relative; /* Added to allow absolute positioning of children if needed, though button is fixed */
        }

        #play-dino-button {
            position: fixed; 
            top: 20px;
            right: 20px;
            font-size: 1.3em; 
            text-decoration: none;
            color: #007bff;
            background-color: white;
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #007bff;
            z-index: 1001; 
        }
        #play-dino-button:hover {
            background-color: #007bff;
            color: white;
        }

        #time-info-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        #time-display {
            font-size: 3em; 
            font-weight: bold;
            color: #333;
        }
        /* Styles for dropdowns if any were added beyond default */
        #country-select, #city-timezone-select {
            padding: 8px 12px;
            font-size: 1em;
            margin: 5px; /* Added some margin for better spacing */
        }

        /* Raindrop styles */
        .raindrop {
            position: absolute;
            background-color: rgba(174, 194, 224, 0.7); /* Light blue, semi-transparent - same as body or slightly different for effect */
            /* For medium size, let's use a slightly larger base than before */
            width: 2px; 
            height: 20px; /* Increased height for 'medium' feel */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; /* Teardrop shape */
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-25px); /* Start further above screen */
                opacity: 1;
            }
            90% {
                opacity: 0.9; /* Start fading a bit earlier */
            }
            100% {
                transform: translateY(100vh); /* Fall to bottom of viewport height */
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="raindrop-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none;"></div>
    <div class="content-wrapper"> 
        <a href="/play_dino_game" id="play-dino-button">PLAY GAME</a>
        <h1>World Time</h1> 

        <div>
            <select id="country-select">
                <option value="">-- Select Country --</option>
            </select>
            <select id="city-timezone-select" disabled>
                <option value="">-- Select City/Region --</option>
            </select>
        </div>

        <div id="time-info-container">
            Selected Timezone: <span id="timezone-name_display">---</span>
            <br> <span id="time-display">Please select location</span>
        </div>
    </div>

    <script>
        const timeDisplayElement = document.getElementById('time-display');
        const timezoneNameDisplayElement = document.getElementById('timezone-name_display');
        const countrySelectElement = document.getElementById('country-select');
        const cityTimezoneSelectElement = document.getElementById('city-timezone-select');

        function formatIANATimezoneName(ianaName) {
            if (!ianaName || typeof ianaName !== 'string') {
                return '---';
            }
            const parts = ianaName.split('/');
            const cityOrRegion = parts[parts.length - 1];
            return cityOrRegion.replace(/_/g, ' ');
        }

        async function populateCountries() {
            try {
                const response = await fetch('/api/countries'); // This matches Flask/CherryPy API
                const countries = await response.json();
                countries.sort((a, b) => a.name.localeCompare(b.name));
                countries.forEach(country => {
                    const option = new Option(country.name, country.code);
                    countrySelectElement.add(option);
                });
            } catch (error) {
                console.error("Could not fetch countries:", error);
            }
        }

        countrySelectElement.addEventListener('change', async function() {
            const selectedCountryCode = this.value;
            cityTimezoneSelectElement.innerHTML = '<option value="">-- Select City/Region --</option>';
            cityTimezoneSelectElement.disabled = true;
            timeDisplayElement.textContent = 'Please select location';
            timezoneNameDisplayElement.textContent = '---';

            if (selectedCountryCode) {
                try {
                    const response = await fetch(`/api/timezones_for_country/${selectedCountryCode}`); // Matches Flask/CherryPy API
                    if (!response.ok) throw new Error(`Error fetching timezones: ${response.statusText}`);
                    const timezones = await response.json();
                    if (timezones.length > 0) {
                        timezones.forEach(tz => {
                            const friendlyName = formatIANATimezoneName(tz);
                            const option = new Option(friendlyName, tz);
                            cityTimezoneSelectElement.add(option);
                        });
                        cityTimezoneSelectElement.disabled = false;
                        if (timezones.length === 1) {
                            cityTimezoneSelectElement.value = timezones[0];
                            updateTime();
                        }
                    } else {
                        cityTimezoneSelectElement.innerHTML = '<option value="">No timezones found</option>';
                    }
                } catch (error) {
                    console.error("Could not fetch timezones for country:", error);
                    cityTimezoneSelectElement.innerHTML = '<option value="">Error loading timezones</option>';
                }
            }
        });

        cityTimezoneSelectElement.addEventListener('change', updateTime);

        async function updateTime() {
            const selectedIANATimezone = cityTimezoneSelectElement.value;

            if (!selectedIANATimezone) {
                timeDisplayElement.textContent = 'Please select location';
                timezoneNameDisplayElement.textContent = '---';
                return; 
            }

            try {
                const response = await fetch(`/api/time?timezone=${selectedIANATimezone}`); // Matches Flask/CherryPy API
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                timeDisplayElement.textContent = data.current_time;
                timezoneNameDisplayElement.textContent = formatIANATimezoneName(data.timezone);
            } catch (error) {
                console.error("Could not fetch time:", error);
                timeDisplayElement.textContent = "Error loading time.";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            populateCountries();
            initRain(); 
            // Removed old dino game JS event listeners and related variables
        });
        setInterval(updateTime, 1000);

        function createRaindrop() {
            const container = document.getElementById('raindrop-container');
            if (!container) return;

            const drop = document.createElement('div');
            drop.classList.add('raindrop');
            
            drop.style.left = Math.random() * 100 + 'vw'; 
            
            const fallDuration = Math.random() * 2 + 3; // Duration between 3s and 5s for medium speed
            drop.style.animationDuration = fallDuration + 's';
            
            drop.style.animationDelay = Math.random() * 4 + 's'; // Stagger start times

            // Slightly vary raindrop dimensions for a more natural look
            const randomHeight = Math.random() * 10 + 15; // Height between 15px and 25px for 'medium'
            drop.style.height = randomHeight + 'px';
            drop.style.width = (randomHeight / 10) + 'px'; // Maintain a reasonable aspect ratio for teardrops (e.g., 10:1 height:width)

            container.appendChild(drop);

            setTimeout(() => {
                if (drop.parentNode === container) {
                   container.removeChild(drop);
                }
            }, (fallDuration + parseFloat(drop.style.animationDelay || 0)) * 1000 + 100);
        }

        function initRain() {
            const numberOfDrops = 120; // Adjust for desired density
            for (let i = 0; i < numberOfDrops; i++) {
                setTimeout(createRaindrop, Math.random() * 3000); // Stagger initial creation
            }
            setInterval(createRaindrop, 200); // Continuously add new drops (e.g., 5 per second)
        }
    </script>
</body>
</html>
