<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Time</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center content horizontally */
            justify-content: center; /* Center content vertically */
            min-height: 90vh; /* Ensure content is centered on viewport */
            margin: 0;
            text-align: center; /* Center text for block elements like h1, form */
        }
        .content-wrapper {
            /* This class is for grouping if needed, but direct body styling might be enough */
        }
        #time-info-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        #time-display {
            font-size: 3em; /* Make the time significantly larger */
            font-weight: bold;
            color: #333;
        }
        select[name="timezone"], input[type="submit"] {
            padding: 8px 12px;
            font-size: 1em;
            margin-top: 10px;
        }

        /* Headline Styles */
        #headlines-section {
            margin-top: 30px;
            text-align: left;
            width: 80%;
            max-width: 700px; /* Increased max-width slightly */
            margin-left: auto;  /* Center the section itself */
            margin-right: auto; /* Center the section itself */
        }

        #headlines-list {
            list-style-type: none; /* Remove default bullets */
            padding-left: 0;       /* Remove default user-agent padding */
        }

        #headlines-list li {
            margin-bottom: 18px; /* Increase space between headline items */
            padding: 10px;       /* Add some padding around each item for a softer look */
            border-bottom: 1px solid #eee; /* Subtle separator */
        }

        #headlines-list li:last-child {
            border-bottom: none; /* No border for the last item */
        }

        #headlines-list li a {
            font-size: 1.2em;    /* Make headline link text bigger */
            color: #333;         /* Darker color, less like default blue */
            text-decoration: none; /* Remove underline by default */
            font-weight: bold;   /* Make titles stand out more */
        }

        #headlines-list li a:hover,
        #headlines-list li a:focus { /* Added :focus for accessibility */
            text-decoration: underline; /* Underline on hover/focus to indicate clickability */
            color: #007bff; /* Optional: change color on hover, e.g., to a theme blue */
        }

        #headlines-list li > span { 
            font-size: 0.85em; /* Slightly smaller */
            color: #666;     /* Grey color for source */
            margin-left: 5px; /* Space it from the link if they are siblings - adjusted as it will be on new line */
            display: block; /* Make it appear on a new line */
            margin-top: 4px; /* Space from the title if on new line */
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1>World Time</h1>

        <div>
            <select id="country-select">
                <option value="">-- Select Country --</option>
            </select>
            <select id="city-timezone-select" disabled>
                <option value="">-- Select City/Region --</option>
            </select>
        </div>

        <div id="time-info-container">
            Selected Timezone: <span id="timezone-name_display">---</span>
            <br> <span id="time-display">Please select location</span>
        </div>

        <div id="headlines-section">
            <h2>Top Headlines</h2>
            <ul id="headlines-list">
                <li>Loading headlines...</li>
            </ul>
        </div>

    </div>
    <script>
        const timeDisplayElement = document.getElementById('time-display');
        const timezoneNameDisplayElement = document.getElementById('timezone-name_display');
        const countrySelectElement = document.getElementById('country-select');
        const cityTimezoneSelectElement = document.getElementById('city-timezone-select');

        function formatIANATimezoneName(ianaName) {
            if (!ianaName || typeof ianaName !== 'string') {
                return '---';
            }
            // Split by '/' and take the last part
            const parts = ianaName.split('/');
            const cityOrRegion = parts[parts.length - 1];
            // Replace underscores with spaces
            return cityOrRegion.replace(/_/g, ' ');
        }

        async function populateCountries() {
            try {
                const response = await fetch('/api/countries');
                const countries = await response.json();
                countries.sort((a, b) => a.name.localeCompare(b.name)); // Sort countries by name
                countries.forEach(country => {
                    const option = new Option(country.name, country.code);
                    countrySelectElement.add(option);
                });
            } catch (error) {
                console.error("Could not fetch countries:", error);
            }
        }

        countrySelectElement.addEventListener('change', async function() {
            const selectedCountryCode = this.value;
            cityTimezoneSelectElement.innerHTML = '<option value="">-- Select City/Region --</option>'; // Clear old options
            cityTimezoneSelectElement.disabled = true;
            timeDisplayElement.textContent = 'Please select location';
            timezoneNameDisplayElement.textContent = '---';

            if (selectedCountryCode) {
                try {
                    const response = await fetch(`/api/timezones_for_country/${selectedCountryCode}`);
                    if (!response.ok) throw new Error(`Error fetching timezones: ${response.statusText}`);
                    const timezones = await response.json();
                    if (timezones.length > 0) {
                        timezones.forEach(tz => {
                            const friendlyName = formatIANATimezoneName(tz);
                            const option = new Option(friendlyName, tz); // Display friendlyName, value is full IANA name
                            cityTimezoneSelectElement.add(option);
                        });
                        cityTimezoneSelectElement.disabled = false;
                        if (timezones.length === 1) { // If only one timezone, auto-select and update time
                            cityTimezoneSelectElement.value = timezones[0];
                            updateTime();
                        }
                    } else {
                        cityTimezoneSelectElement.innerHTML = '<option value="">No timezones found</option>';
                    }
                } catch (error) {
                    console.error("Could not fetch timezones for country:", error);
                    cityTimezoneSelectElement.innerHTML = '<option value="">Error loading timezones</option>';
                }
            }
        });

        cityTimezoneSelectElement.addEventListener('change', updateTime);

        async function updateTime() {
            const selectedIANATimezone = cityTimezoneSelectElement.value;

            if (!selectedIANATimezone) {
                timeDisplayElement.textContent = 'Please select location';
                timezoneNameDisplayElement.textContent = '---';
                return; 
            }

            try {
                const response = await fetch(`/api/time?timezone=${selectedIANATimezone}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                timeDisplayElement.textContent = data.current_time;
                // data.timezone is the IANA name from the API (e.g., 'America/New_York')
                timezoneNameDisplayElement.textContent = formatIANATimezoneName(data.timezone);
            } catch (error) {
                console.error("Could not fetch time:", error);
                timeDisplayElement.textContent = "Error loading time.";
            }
        }

        document.addEventListener('DOMContentLoaded', populateCountries);
        setInterval(updateTime, 1000);

        async function displayHeadlines() {
            const headlinesListElement = document.getElementById('headlines-list');
            const headlinesSectionElement = document.getElementById('headlines-section'); // Get the section for error messages

            try {
                const response = await fetch('/api/headlines');
                // No need to check response.ok here if errors are always sent with 200/503 and an error field in JSON
                const data = await response.json();

                headlinesListElement.innerHTML = ''; // Clear "Loading..." or old headlines

                if (data.error) {
                    const errorItem = document.createElement('li');
                    errorItem.textContent = `Error: ${data.error}`;
                    errorItem.style.color = 'red';
                    headlinesListElement.appendChild(errorItem);
                    return;
                }

                if (data.articles && data.articles.length > 0) {
                    data.articles.forEach(article => {
                        const listItem = document.createElement('li');
                        
                        const link = document.createElement('a');
                        link.href = article.link;
                        link.textContent = article.title;
                        link.target = '_blank'; // Open in new tab
                        link.rel = 'noopener noreferrer'; // Security best practice for target="_blank"
                        
                        listItem.appendChild(link);
                        
                        if (article.source) {
                            const sourceSpan = document.createElement('span');
                            sourceSpan.textContent = ` (Source: ${article.source})`;
                            sourceSpan.style.fontSize = '0.9em';
                            sourceSpan.style.color = '#555';
                            listItem.appendChild(sourceSpan);
                        }
                        headlinesListElement.appendChild(listItem);
                    });
                } else {
                    const noNewsItem = document.createElement('li');
                    noNewsItem.textContent = 'No headlines available at the moment.';
                    headlinesListElement.appendChild(noNewsItem);
                }

            } catch (error) {
                console.error("Could not display headlines:", error);
                headlinesListElement.innerHTML = ''; // Clear
                const errorItem = document.createElement('li');
                errorItem.textContent = 'Failed to load headlines. Please check console for details.';
                errorItem.style.color = 'red';
                headlinesListElement.appendChild(errorItem);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            populateCountries();
            displayHeadlines(); // Add this line
        });
    </script>
</body>
</html>
