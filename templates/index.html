<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Time</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center content horizontally */
            justify-content: center; /* Center content vertically */
            min-height: 90vh; /* Ensure content is centered on viewport */
            margin: 0;
            text-align: center; /* Center text for block elements like h1, form */
        }
        .content-wrapper {
            /* This class is for grouping if needed, but direct body styling might be enough */
        }
        #time-info-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        #time-display {
            font-size: 3em; /* Make the time significantly larger */
            font-weight: bold;
            color: #333;
        }
        select[name="timezone"], input[type="submit"] {
            padding: 8px 12px;
            font-size: 1em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1>World Time</h1>

        <div id="time-info-container">
            Current time in <span id="timezone-name_display">{{ selected_timezone }}</span>: 
            <br> <span id="time-display">{{ current_time }}</span>
        </div>

        <form method="GET" action="/">
            <label for="timezone">Select Timezone:</label>
            <select name="timezone" id="timezone" onchange="this.form.submit()">
                {% for tz in timezones %}
                    <option value="{{ tz }}" {% if tz == selected_timezone %}selected{% endif %}>{{ tz }}</option>
                {% endfor %}
            </select>
            <input type="submit" value="Get Time">
        </form>
    </div>
    <script>
        const timeDisplayElement = document.getElementById('time-display');
        const timezoneNameDisplayElement = document.getElementById('timezone-name_display');
        const timezoneSelectElement = document.querySelector('select[name="timezone"]');

        async function updateTime() {
            const selectedTimezone = timezoneSelectElement.value;

            try {
                const response = await fetch(`/api/time?timezone=${selectedTimezone}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                timeDisplayElement.textContent = data.current_time;
                timezoneNameDisplayElement.textContent = data.timezone; // Update the displayed timezone name
            } catch (error) {
                console.error("Could not fetch time:", error);
                timeDisplayElement.textContent = "Error loading time.";
            }
        }

        // Update time immediately on page load
        // The form now submits on change, so a separate JS event listener for change is not strictly needed
        // if the goal is to reload the page with the new timezone.
        // However, updateTime() is still useful for the initial load and the interval.
        updateTime();

        // Update time every second
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
